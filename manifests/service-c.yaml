apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-c
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
  namespace: default
  labels:
    app: service-c
spec:
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
    spec:
      serviceAccountName: service-c
      containers:
        - name: service-c
          image: spiffe-demo:0.2
          command: ["/usr/local/bin/client"]
          env:
            - name: SERVER_ID
              value: spiffe://example.org/ns/default/sa/service-b
            - name: SERVER_URL
              value: https://service-b:8443/
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
