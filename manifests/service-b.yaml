apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-b
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: default
  labels:
    app: service-b
spec:
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      serviceAccountName: service-b
      containers:
        - name: service-b
          image: spiffe-demo:0.1
          command: ["/usr/local/bin/server"]
          env:
            - name: ALLOWED_CLIENT
              value: spiffe://example.org/ns/default/sa/service-a
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: default
spec:
  selector:
    app: service-b
  ports:
    - name: https
      port: 8443
      targetPort: https
